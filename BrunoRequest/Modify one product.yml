info:
  name: Modify one product
  type: http
  seq: 1

http:
  method: PUT
  url: http://localhost:8081/api/produits/1
  body:
    type: json
    data: |-
      {
       "nomProduit": "Burger",
      "designation": "Junk food for bullshit",
       "prixUnitaire": 1.2
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
